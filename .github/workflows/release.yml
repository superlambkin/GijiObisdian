name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: obsidian-plugin
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: obsidian-plugin/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Verify tag matches manifest version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VER=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$VER" ]; then
            echo "タグ($TAG) と package.json のバージョン($VER) が不一致"; exit 1
          fi

      - name: Build
        run: node esbuild.config.mjs production

      - name: Verify release assets exist (v0.15.2)
        run: |
          REQUIRED_FILES=("main.js" "manifest.json" "worker.js" "ffmpeg-core.js" "ffmpeg-core.wasm")
          MISSING=0
          for f in "${REQUIRED_FILES[@]}"; do
            if [ ! -f "$f" ]; then
              echo "❌ リリース成果物 $f が見つかりません"
              MISSING=$((MISSING + 1))
            fi
          done
          if [ $MISSING -gt 0 ]; then
            echo "::error::リリース成果物が $MISSING 件欠落（action-gh-release の files パスを見直してください）"
            exit 1
          fi
          echo "✅ リリース成果物 ${#REQUIRED_FILES[@]} 件すべて存在"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            obsidian-plugin/main.js
            obsidian-plugin/manifest.json
            obsidian-plugin/worker.js
            obsidian-plugin/ffmpeg-core.js
            obsidian-plugin/ffmpeg-core.wasm
